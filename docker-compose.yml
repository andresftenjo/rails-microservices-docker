version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: andres
      POSTGRES_PASSWORD: andres
      POSTGRES_DB: main_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5555:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andres"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit_service:
    build: ./audit_service
    container_name: audit_service
    environment:
      RAILS_ENV: development
      PGUSER: andres
      PGPASSWORD: andres
      DATABASE_URL: postgres://andres:andres@postgres:5432/audit_service_development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  customers_service:
    build: ./customers_service
    container_name: customers_service
    environment:
      RAILS_ENV: development
      PGUSER: andres
      PGPASSWORD: andres
      DATABASE_URL: postgres://andres:andres@postgres:5432/customers_service_development
      AUDIT_BASE_URL: http://audit_service:3003
    depends_on:
      postgres:
        condition: service_healthy
      audit_service:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  invoices_service:
    build: ./invoices_service
    container_name: invoices_service
    environment:
      RAILS_ENV: development
      PGUSER: andres
      PGPASSWORD: andres
      DATABASE_URL: postgres://andres:andres@postgres:5432/invoices_service_development
      CUSTOMERS_BASE_URL: http://customers_service:3001
      AUDIT_BASE_URL: http://audit_service:3003
    depends_on:
      postgres:
        condition: service_healthy
      customers_service:
        condition: service_healthy
      audit_service:
        condition: service_healthy
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
